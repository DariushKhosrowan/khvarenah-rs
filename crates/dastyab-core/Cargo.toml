[package]
name = "dastyab-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Core library for DastYab — a Cloudflare-Workers VLESS VPN console."

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
rand.workspace = true
url.workspace = true
percent-encoding.workspace = true
base64.workspace = true
dirs.workspace = true
tempfile.workspace = true
sha2.workspace = true
flate2.workspace = true
tar.workspace = true
tokio.workspace = true
reqwest.workspace = true
bytes.workspace = true
tracing.workspace = true
qrcode.workspace = true
futures-util = "0.3"
tokio-rustls = { version = "0.26", features = ["aws_lc_rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
rcgen = { version = "0.13", optional = true }

[dev-dependencies]
anyhow.workspace = true
filetime.workspace = true
# rcgen is used by the health.rs mock-TLS test helpers and the mock worker.
# It must be present for `cargo test` (no feature flags in CI), so it lives
# in dev-dependencies; the `dev-mock` feature's optional dep is a superset
# for the mock-worker module.
rcgen = { version = "0.13" }

[features]
default = []
dev-mock = ["rcgen"]
