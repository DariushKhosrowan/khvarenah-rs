name: Release

# Automatic release builder. Triggered by pushing a `v*` tag (e.g. v0.1.0).
# Builds the full workspace natively on each target runner and publishes a
# GitHub Release containing .deb installers (Linux), .exe / portable zip
# (Windows), raw binaries for all platforms, and a SHA256SUMS.txt file.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-amd64
            arch: amd64
            deb: true
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
            arch: arm64
            deb: true
          - os: windows-latest
            artifact: windows-amd64
            arch: amd64
            exe: true
            zip: true
          - os: macos-latest
            artifact: macos-arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps (GUI/egui)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev libxkbcommon-x11-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.artifact }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.artifact }}-release-cargo-

      - name: Build workspace (release)
        run: cargo build --release --workspace

      - name: Fetch cargo-deb
        if: matrix.deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Build .deb (CLI)
        if: matrix.deb
        run: |
          cargo deb -p dastyab-cli --no-build
          ls -la target/debian/

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BASE="${{ matrix.artifact }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXT=".exe"
          else
            EXT=""
          fi
          for bin in dastyab dastyab-tui dastyab-gui; do
            cp "target/release/${bin}${EXT}" "dist/${bin}-${BASE}${EXT}"
          done
          if [ "${{ matrix.deb }}" = "true" ]; then
            deb_file=$(ls target/debian/*_${{ matrix.arch }}.deb 2>/dev/null | head -n1)
            if [ -z "$deb_file" ]; then
              echo "ERROR: no .deb found for arch ${{ matrix.arch }}"
              ls -la target/debian/ || true
              exit 1
            fi
            cp "$deb_file" "dist/dastyab-${BASE}.deb"
          fi
          if [ "${{ matrix.zip }}" = "true" ]; then
            python scripts/bundle_windows.py "${{ matrix.artifact }}"
          fi
          ls -la dist/

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: dastyab-release-${{ matrix.artifact }}
          path: dist/**
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
